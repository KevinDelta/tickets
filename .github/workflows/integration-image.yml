name: Tourbook integration

on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/integration-image.yml
      - deno.json
      - deno.lock
      - docker-bake.hcl
      - Dockerfile
      - scripts/**
      - src/**
      - test/**

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      - name: Lint
        run: deno task lint:ci

      - name: Typecheck
        run: deno task typecheck

      - name: Check for code duplication
        run: deno task cpd

      - name: Check user-facing copy
        run: deno task check:copy

      - name: Build edge bundle
        run: deno task build:edge

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      - name: Cache stripe-mock
        uses: actions/cache@v4
        with:
          path: .bin
          key: stripe-mock-0.188.0-linux-amd64

      - name: Test with coverage
        env:
          DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: deno task test:coverage

  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      - name: Cache stripe-mock
        uses: actions/cache@v4
        with:
          path: .bin
          key: stripe-mock-0.188.0-linux-amd64

      - name: Mutation-test the integration boundary
        env:
          DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: >-
          deno task mutation
          --source src/features/integration.ts
          --source src/features/integration-bookings.ts
          --source src/features/integration-cancellations.ts
          --source src/features/integration-operations.ts
          --source src/features/app/request.ts
          --test test/features/integration.test.ts
          --test test/features/integration-bookings.test.ts
          --test test/features/integration-cancellations.test.ts
          --test test/features/integration-operations.test.ts
          --test test/features/app/request.test.ts
          --test 'test/features/app/request/**/*.test.ts'
          --harness
          --jobs 4

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ghcr.io/kevindelta/tickets:tourbook-${{ github.sha }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub container registry
        if: github.ref == 'refs/heads/tourbook-v2026-08-18-095849'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 and arm64 image
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: ${{ github.ref == 'refs/heads/tourbook-v2026-08-18-095849' }}
          targets: integration

      - name: Record immutable image evidence
        if: github.ref == 'refs/heads/tourbook-v2026-08-18-095849'
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          echo "Source commit: ${SOURCE_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Manifest digest: ${digest}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Image: ${IMAGE_TAG%:*}@${digest}" >> "${GITHUB_STEP_SUMMARY}"
